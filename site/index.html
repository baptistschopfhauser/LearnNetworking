<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PacketCraft — Learn Networking by Playing</title>
    <meta name="description" content="An interactive, playable course on computer networking: from what a network is to TCP, DNS, routing and TLS — with 3D games." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23070a12'/><circle cx='18' cy='20' r='6' fill='%235cf2c2'/><circle cx='46' cy='20' r='6' fill='%238b7bff'/><circle cx='32' cy='46' r='6' fill='%23ff7a45'/><path d='M18 20L46 20L32 46Z' fill='none' stroke='%23e8ecf5' stroke-width='3'/></svg>" />
    <style>html,body{background:#06080f;color:#e9edf7;margin:0}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="bg-grid" aria-hidden="true"></div>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="PacketCraft home">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><circle cx="18" cy="20" r="6" fill="var(--mint)"/><circle cx="46" cy="20" r="6" fill="var(--violet)"/><circle cx="32" cy="46" r="6" fill="var(--orange)"/><path d="M18 20L46 20L32 46Z" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <span>Packet<b>Craft</b></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/learn" data-nav="learn">Learn</a>
        <a href="#/play" data-nav="play">Play 3D</a>
        <a href="#/lab" data-nav="lab">Toolkit</a>
        <a href="#/glossary" data-nav="glossary">Glossary</a>
        <a href="#/challenge" data-nav="challenge">Challenge</a>
      </nav>
      <div class="topbar-right">
        <button class="search-btn" id="search-btn" aria-label="Search (Ctrl+K)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Search</span><kbd>⌘K</kbd></button>
        <a href="#/profile" class="xp-chip" id="xp-chip" title="Your progress">
          <span class="xp-ring"><svg viewBox="0 0 36 36" width="28" height="28"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="xp-ring-fg"/></svg></span>
          <span id="xp-text">0 XP</span>
        </a>
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div id="toast-root" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
